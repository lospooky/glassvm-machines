[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "glassvm-pico8"
version = "0.1.0"
requires-python = ">=3.12"
description = "PICO-8 machine bundle for GlassVM"
license = "BSD-3-Clause"

[project.entry-points."glassvm.machine_bundles"]
pico8 = "glassvm_pico8:bundle_provider"

[tool.maturin]
module-name = "glassvm_pico8"
manifest-path = "python/Cargo.toml"
include = [
    { path = "core/**/*", format = "sdist" },
    { path = "verifier/**/*", format = "sdist" },
    { path = "bundle/**/*", format = "sdist" },
    { path = "python/**/*", format = "sdist" },
]
