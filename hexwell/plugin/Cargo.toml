publish = false

[dependencies]
glassvm_core = { git = "ssh://git@github.com/lospooky/glassvm.git", tag = "v0.1.0" }
hexwell_core = { path = "../core" }
hexwell_verifier = { path = "../verifier" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
