[package]
name = "glassvm_py_hexwell"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "glassvm_py_hexwell"
crate-type = ["cdylib", "rlib"]

[dependencies]
glassvm_core = "0.1.0"
glassvm_recorder = "0.1.0"
hexwell_plugin = { path = "../plugin" }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = "1"
serde_json = "1"
