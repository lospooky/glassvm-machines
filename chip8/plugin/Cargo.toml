[package]
name = "chip8_plugin"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
cuda = ["chip8_core/cuda"]

[dependencies]
glassvm_core = { git = "ssh://git@github.com/lospooky/glassvm.git", tag = "v0.1.0" }
chip8_core = { path = "../core", features = ["serde"] }
chip8_verifier = { path = "../verifier" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
glassvm_query = { git = "ssh://git@github.com/lospooky/glassvm.git", tag = "v0.1.0" }
glassvm_recorder = { git = "ssh://git@github.com/lospooky/glassvm.git", tag = "v0.1.0" }
