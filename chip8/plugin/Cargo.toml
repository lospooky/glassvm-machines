[package]
name = "chip8_plugin"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[features]
default = []
cuda = ["chip8_core/cuda"]

[dependencies]
glassvm_core = "0.1.0"
chip8_core = { path = "../core", features = ["serde"] }
chip8_verifier = { path = "../verifier" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
glassvm_query = "0.1.0"
glassvm_recorder = "0.1.0"
