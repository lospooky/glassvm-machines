[package]
name = "chip8_core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
serde = ["dep:serde"]
parallel = ["dep:rayon"]
cuda = ["dep:cudarc"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
rayon = { version = "1", optional = true }
sha2 = "0.10"
cudarc = { version = "=0.19.8", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-11040"] }

[dev-dependencies]
