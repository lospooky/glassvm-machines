[package]
name = "glassvm_py_chip8"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "glassvm_py_chip8"
crate-type = ["cdylib", "rlib"]

[dependencies]
chip8_plugin = { path = "../plugin" }
glassvm_core = "0.1.0"
glassvm_recorder = "0.1.0"
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = "1"
serde_json = "1"
