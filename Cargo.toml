[workspace]
members = [
	"chip8/core",
	"chip8/verifier",
	"chip8/bundle",
	"pico8/core",
	"pico8/verifier",
	"pico8/bundle",
	"tic80/core",
	"tic80/verifier",
	"tic80/bundle",
	"chip8/python",
	"pico8/python",
	"tic80/python",
	"conformance",
]
resolver = "2"
exclude = ["vendor/lua-src"]

[patch.crates-io]
lua-src = { path = "vendor/lua-src" }
# Until the coordinated release, build against the repaired GlassVM source.
glassvm_core = { git = "https://github.com/lospooky/glassvm", rev = "97e3ac448ce3516cc9064c79342ad064809ef198" }
glassvm_normalizer_contract = { git = "https://github.com/lospooky/glassvm", rev = "97e3ac448ce3516cc9064c79342ad064809ef198" }
glassvm_query = { git = "https://github.com/lospooky/glassvm", rev = "97e3ac448ce3516cc9064c79342ad064809ef198" }
glassvm_recorder = { git = "https://github.com/lospooky/glassvm", rev = "97e3ac448ce3516cc9064c79342ad064809ef198" }
glassvm_registry = { git = "https://github.com/lospooky/glassvm", rev = "97e3ac448ce3516cc9064c79342ad064809ef198" }

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "BSD-3-Clause"
