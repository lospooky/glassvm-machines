[package]
name = "glassvm_py_tic80"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[lib]
name = "glassvm_py_tic80"
crate-type = ["cdylib", "rlib"]

[dependencies]
glassvm_core = "0.1.0"
glassvm_recorder = "0.1.0"
pyo3 = { version = "0.27", features = ["extension-module"] }
serde = "1"
serde_json = "1"
tic80_plugin = { path = "../plugin" }
